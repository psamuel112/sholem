# Render Blueprint — provisions the Strapi CMS and its PostgreSQL database.
#
# Usage: push this repo to GitHub, then in Render choose
# New → Blueprint and point it at the repository. Render reads this file and
# creates both resources.
#
# Secrets marked `sync: false` must be filled in through the Render dashboard —
# they are deliberately not stored in version control.

databases:
  - name: tpi-homes-db
    databaseName: tpi_homes
    user: tpi_homes
    plan: free
    postgresMajorVersion: '16'

services:
  - type: web
    name: tpi-homes-cms
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /_health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      # Render injects PORT at runtime; Strapi reads it automatically.

      # ---- Database (wired from the managed Postgres instance above) ----
      - key: DATABASE_CLIENT
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: tpi-homes-db
          property: connectionString
      - key: DATABASE_SSL
        value: 'true'
      # Render's managed PostgreSQL certificate is not rooted in Node's default
      # CA bundle. Keep the connection encrypted without rejecting its chain.
      - key: DATABASE_SSL_REJECT_UNAUTHORIZED
        value: 'false'

      # ---- Strapi secrets: generate once, then paste into the dashboard ----
      - key: APP_KEYS
        generateValue: true
      - key: API_TOKEN_SALT
        generateValue: true
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: TRANSFER_TOKEN_SALT
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true

      # ---- Frontend integration: set to the Vercel domain ----
      - key: CORS_ORIGINS
        sync: false
      - key: INQUIRY_NOTIFICATION_EMAIL
        sync: false

      # ---- Email delivery (Resend SMTP via the Strapi nodemailer provider) ----
      # SMTP_PASS is your Resend API key (https://resend.com/api-keys).
      # EMAIL_FROM must use a domain verified in Resend.
      - key: SMTP_HOST
        value: smtp.resend.com
      - key: SMTP_PORT
        value: '465'
      - key: SMTP_USER
        value: resend
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        value: 'Sholem Properties <noreply@tpihomes.com.ng>'
      - key: EMAIL_REPLY_TO
        value: info@tpihomes.com.ng

      # ---- Media storage ----
      # Render's filesystem is ephemeral on the free plan, so uploads must go to
      # Cloudinary. Without these the local provider is used and images are lost
      # on every redeploy.
      - key: CLOUDINARY_NAME
        sync: false
      - key: CLOUDINARY_KEY
        sync: false
      - key: CLOUDINARY_SECRET
        sync: false
